<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Elite Fitness Dashboard</title>
  <style>
    :root {
      --accent: #FF3B30;
      --bg: #000;
      --surface: #1C1C1E;
      --text: #FFF;
      --muted: #8E8E93;
      --border: #2C2C2E;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 40px 20px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .stats-row {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }
    .stat-card {
      background: var(--bg);
      padding: 15px;
      border-radius: 12px;
      flex: 1;
      text-align: center;
      border: 1px solid var(--border);
    }
    .stat-value { font-size: 20px; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-top: 4px; }

    nav {
      display: flex;
      overflow-x: auto;
      background: var(--surface);
      padding: 10px;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .tab-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 20px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    main { padding: 20px; flex: 1; overflow-y: auto; }
    .workout-panel { display: none; }
    .workout-panel.active { display: block; }

    .exercise-card {
      background: var(--surface);
      margin-bottom: 10px;
      padding: 15px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .check-circle {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
    }
    .exercise-card.done { opacity: 0.5; }
    .exercise-card.done .check-circle { background: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>

<header>
  <h1>Training Dashboard</h1>
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="stat-completed">0</div>
      <div class="stat-label">Done Today</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-streak">1</div>
      <div class="stat-label">Day Streak</div>
    </div>
  </div>
</header>

<nav id="tabs">
  <button class="tab-btn active" onclick="switchTab('a')">Workout A</button>
  <button class="tab-btn" onclick="switchTab('b')">Workout B</button>
  <button class="tab-btn" onclick="switchTab('emergency')">Emergency</button>
</nav>

<main>
  <div id="panel-a" class="workout-panel active">
    <div class="exercise-card" onclick="toggleEx(this)">
      <span>Kettlebell Swings (40s)</span>
      <div class="check-circle"></div>
    </div>
    
    <div class="exercise-card" onclick="toggleEx(this)">
      <span>Push-Ups (40s)</span>
      <div class="check-circle"></div>
    </div>
    
    <div class="exercise-card" onclick="toggleEx(this)">
      <span>Glute Bridges (40s)</span>
      <div class="check-circle"></div>
    </div>
  </div>

  <div id="panel-b" class="workout-panel">
    <div class="exercise-card" onclick="toggleEx(this)">
      <span>Goblet Squats (40s)</span>
      <div class="check-circle"></div>
    </div>
    
    <div class="exercise-card" onclick="toggleEx(this)">
      <span>Reverse Lunges (40s)</span>
      <div class="check-circle"></div>
    </div>
  </div>
</main>

<script>
  function switchTab(id) {
    document.querySelectorAll('.workout-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + id).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  function toggleEx(el) {
    el.classList.toggle('done');
    updateStats();
  }

  function updateStats() {
    const done = document.querySelectorAll('.exercise-card.done').length;
    document.getElementById('stat-completed').innerText = done;
  }
</script>

</body>
</html>
